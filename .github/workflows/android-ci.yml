name: Android CI

# Works two ways:
#  1) repo contains the project ZIP at its root (upload the .zip as-is, no unzipping) -> it is unzipped here
#  2) repo contains the unzipped project -> it is built directly
#
# This project's Gradle wrapper jar (a binary) is intentionally not committed — see README
# "Build & Verification". This workflow uses gradle/actions/setup-gradle to provision Gradle
# 8.14.5 directly instead of relying on a wrapper.

on:
  push:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate (and unzip, if needed) the project
        run: |
          if ls *.zip >/dev/null 2>&1; then
            Z=$(ls -t *.zip | head -1)
            echo "Unzipping $Z"
            mkdir -p _src && unzip -q -o "$Z" -d _src
            S=$(find _src -name settings.gradle.kts | head -1)
          else
            S=$(find . -name settings.gradle.kts -not -path './_src/*' | head -1)
          fi
          test -n "$S" || { echo "settings.gradle.kts not found"; exit 1; }
          echo "PROJECT_DIR=$(dirname "$S")" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.14.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.5

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -o pipefail
          gradle assembleDebug --continue --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Show errors in summary
        if: failure()
        run: |
          {
            echo '### Build errors'
            echo '```'
            grep -E '^e: ' build.log | sed -E "s#file:///home/runner/work/[^/]+/[^/]+/(_src/)?##" | head -80
            grep -A3 'What went wrong' build.log | head -60
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run unit tests
        if: success()
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle test --stacktrace

      - name: Run lint
        if: success()
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle lint --stacktrace

      - name: Build unsigned release APK
        if: success()
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleRelease --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: fajer-wifi-audit-debug
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk

      - name: Upload release APK (unsigned)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: fajer-wifi-audit-release-unsigned
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/*.apk

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: ${{ env.PROJECT_DIR }}/app/build/reports/lint-results-*.html

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: ${{ env.PROJECT_DIR }}/app/build/reports/tests/

      - name: Publish APK to Releases (direct download, no unzip)
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: FAJER WiFi Audit debug build ${{ github.run_number }}
          files: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
